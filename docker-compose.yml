services:
  app:
    build: .
    ports:
      - "8000:8000"
    
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db 
    
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: ${POSTGRES_DB} 
  
volumes:
  postgres_data: 
        
